[project]
name = "hajime-api"
version = "0.2.0"
description = "API de la plataforma de gestión de torneos de karate (Hajime)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0,<2.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "openpyxl>=3.1",
    "reportlab>=4.2",
    "python-multipart>=0.0.9",
    "alembic>=1.13",
    # Avisos Web Push (docs/avisos-push.md): cifrado aes128gcm (RFC 8291) y claves VAPID (ES256).
    "cryptography>=44",
    "http-ece>=1.2",
]

[project.optional-dependencies]
mssql = ["pyodbc>=5.1"]
# Telemetría en Azure Application Insights (opcional; ver app/observability.py)
azure = ["azure-monitor-opentelemetry>=1.6"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.setuptools.package-data]
app = ["migrations/*.mako", "data/*.json"]
