<!doctype html>
<html lang="es-PE">
  <head>
    <meta charset="utf-8" />
    <title>Hajime · Torneos de karate</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Hajime: gestión de torneos de karate. Organiza con calma, registra cada combate con respeto."
    />
    <!-- Vista previa al compartir un enlace (WhatsApp, Facebook): sin SSR, estas
         genéricas; la página pública las reemplaza por las del torneo (share-meta.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hajime" />
    <meta property="og:title" content="Hajime · Torneos de karate en vivo" />
    <meta
      property="og:description"
      content="Combates en vivo, horarios, llaves y resultados de torneos de karate."
    />
    <meta property="og:image" content="/icons/icon-512x512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#F5F0E6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141311" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <script>
      // Aplica el tema guardado antes de pintar (evita un destello claro en modo oscuro).
      try {
        var t = localStorage.getItem('hajime.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Hajime necesita JavaScript para funcionar.</noscript>
  </body>
</html>
