name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: pytest -q
      - name: Las migraciones cubren todos los cambios del modelo
        run: HAJIME_DATABASE_URL=sqlite:///ci.db alembic upgrade head && HAJIME_DATABASE_URL=sqlite:///ci.db alembic check
      - name: El DDL de SQL Server está al día
        run: |
          python scripts/export_ddl.py
          git diff --exit-code ../sql/001_schema.sql

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng build

  docker:
    # Construye la imagen "todo en uno", la prueba y la publica en GHCR.
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t hajime:ci .
      - name: Prueba de humo del contenedor
        run: |
          docker run -d --name hajime -p 8000:8000 -e HAJIME_ADMIN_PASSWORD=ci-password-123 hajime:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf localhost:8000/ | grep -qi "<app-root"
          curl -sf localhost:8000/mesa/1 | grep -qi "<app-root"
          TOKEN=$(curl -sf localhost:8000/api/v1/auth/login -H 'content-type: application/json' \
            -d '{"username":"admin","password":"ci-password-123"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')
          curl -sf localhost:8000/api/v1/templates -H "Authorization: Bearer $TOKEN" | python3 -c \
            'import sys,json; t=json.load(sys.stdin); assert t and len(t[0]["items"]) > 0, t; print("plantilla:", len(t[0]["items"]), "categorías")'
          docker logs hajime | tail -20
      - name: Publicar en GitHub Container Registry
        if: github.event_name == 'push'
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          BRANCH=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag hajime:ci "$IMAGE:$BRANCH"
          docker tag hajime:ci "$IMAGE:sha-${GITHUB_SHA::7}"
          docker push "$IMAGE:$BRANCH"
          docker push "$IMAGE:sha-${GITHUB_SHA::7}"
          if [ "$GITHUB_REF_NAME" = "main" ]; then docker tag hajime:ci "$IMAGE:latest" && docker push "$IMAGE:latest"; fi
          echo "Imagen publicada: $IMAGE:$BRANCH" >> "$GITHUB_STEP_SUMMARY"
      - name: Imagen para Azure (con el driver de SQL Server)
        if: github.event_name == 'push'
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          BRANCH=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          docker build --build-arg WITH_MSSQL=true -t hajime:azure .
          docker run --rm hajime:azure python -c "import pyodbc; assert 'ODBC Driver 18 for SQL Server' in pyodbc.drivers(), pyodbc.drivers()"
          docker tag hajime:azure "$IMAGE:$BRANCH-azure"
          docker tag hajime:azure "$IMAGE:sha-${GITHUB_SHA::7}-azure"
          docker push "$IMAGE:$BRANCH-azure"
          docker push "$IMAGE:sha-${GITHUB_SHA::7}-azure"
          if [ "$GITHUB_REF_NAME" = "main" ]; then docker tag hajime:azure "$IMAGE:azure" && docker push "$IMAGE:azure"; fi
          echo "Imagen Azure: $IMAGE:sha-${GITHUB_SHA::7}-azure" >> "$GITHUB_STEP_SUMMARY"

  deploy-test:
    # Publica cada versión en el ambiente de pruebas de Azure. Se activa sola
    # cuando existen las variables del repositorio AZURE_CLIENT_ID,
    # AZURE_TENANT_ID y AZURE_SUBSCRIPTION_ID (ver infra/azure/conectar-github.sh).
    needs: [docker]
    if: >-
      github.event_name == 'push' && vars.AZURE_CLIENT_ID != '' &&
      github.ref_name == (vars.AZURE_TEST_BRANCH || 'main')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Actualizar la app de pruebas
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update -g hajime-test -n hajime-test --image "$IMAGE:sha-${GITHUB_SHA::7}-azure" -o none
          FQDN=$(az containerapp show -g hajime-test -n hajime-test --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 30); do curl -sf "https://$FQDN/health" && break; sleep 10; done
          echo "Publicado en pruebas: https://$FQDN" >> "$GITHUB_STEP_SUMMARY"
