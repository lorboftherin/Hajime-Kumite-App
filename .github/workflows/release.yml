name: Release

# Al empujar una etiqueta vX.Y.Z (ver CONTRIBUTING.md → «Versiones»):
#   1. verifica que coincida con VERSION y que CHANGELOG.md tenga sus notas;
#   2. construye, prueba y escanea las imágenes y las publica como
#      :X.Y.Z, :X.Y (SQLite) y :X.Y.Z-azure, :X.Y-azure (Azure SQL);
#   3. compila el APK de Android con la versión en el nombre;
#   4. crea el Release de GitHub con las notas del CHANGELOG y el APK.
# Para desplegar la versión en producción: workflow «Desplegar a producción»
# con la entrada «X.Y.Z».

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        run: |
          V="$(cat VERSION)"
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "La etiqueta $GITHUB_REF_NAME no coincide con VERSION ($V)" >&2
            exit 1
          fi
          python3 scripts/version.py --check
          bash scripts/notas-version.sh "$V" > /dev/null
          echo "version=$V" >> "$GITHUB_OUTPUT"

  imagen:
    needs: [verificar]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      V: ${{ needs.verificar.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: nombres
        run: |
          echo "imagen=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "menor=${V%.*}" >> "$GITHUB_OUTPUT"
      - name: Construir imagen (SQLite)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: hajime:release
          labels: |
            org.opencontainers.image.version=${{ env.V }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=hajime
      - name: Construir imagen para Azure
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: hajime:release-azure
          build-args: WITH_MSSQL=true
          labels: |
            org.opencontainers.image.version=${{ env.V }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: |
            type=gha,scope=hajime
            type=gha,scope=hajime-azure
      - name: Pruebas de humo
        run: |
          bash scripts/humo-contenedor.sh hajime:release
          PUERTO=8001 bash scripts/humo-contenedor.sh hajime:release-azure --mssql
      - name: Trivy (CRITICAL corregibles)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hajime:release-azure
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Publicar
        env:
          IMAGEN: ${{ steps.nombres.outputs.imagen }}
          MENOR: ${{ steps.nombres.outputs.menor }}
        run: |
          publicar() { docker tag "$1" "$IMAGEN:$2" && docker push -q "$IMAGEN:$2"; }
          publicar hajime:release "$V"
          publicar hajime:release "$MENOR"
          publicar hajime:release-azure "$V-azure"
          publicar hajime:release-azure "$MENOR-azure"
          echo "Imágenes: \`$IMAGEN:$V\` y \`$IMAGEN:$V-azure\`" >> "$GITHUB_STEP_SUMMARY"

  android:
    needs: [verificar]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: npm ci --no-audit --no-fund
      - run: npm run build:mobile
      - run: npx cap sync android
      # APK de depuración (instalable sin Google Play). Para la tienda hará
      # falta firmar un AAB de release con la llave del dueño (secretos aparte).
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon --quiet
      - run: |
          mkdir -p ../apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "../apk/hajime-${{ needs.verificar.outputs.version }}.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-release
          path: apk/*.apk
          retention-days: 7

  publicar:
    needs: [verificar, imagen, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-release
          path: apk
      - run: bash scripts/notas-version.sh "${{ needs.verificar.outputs.version }}" > notas.md
      - name: Crear el Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: Hajime ${{ needs.verificar.outputs.version }}
          body_path: notas.md
          files: apk/*.apk
