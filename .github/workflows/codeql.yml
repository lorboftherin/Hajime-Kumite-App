name: CodeQL

# Análisis estático de seguridad del backend (Python) y del frontend
# (TypeScript). Los hallazgos aparecen en Security → Code scanning.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # lunes 01:17 en Lima
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analizar:
    name: Analizar (${{ matrix.lenguaje }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        lenguaje: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.lenguaje }}
          build-mode: none
          queries: security-extended
      # El repositorio es privado y no tiene activado «Code scanning» (requiere
      # GitHub Code Security); subir los resultados ahí falla. Se guardan como
      # artefacto de la corrida. Al activar Code scanning en Settings → Code
      # security, basta con quitar `upload: never` para verlos en Security.
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.lenguaje }}"
          upload: never
          output: resultados-codeql
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-${{ matrix.lenguaje }}
          path: resultados-codeql/*.sarif
          retention-days: 30
