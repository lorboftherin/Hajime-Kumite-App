# Uso normal (pruebas, torneo mock): un solo contenedor con SQLite.
#   docker compose up -d
#   abrir http://localhost:8000   (usuario admin, contraseña de HAJIME_ADMIN_PASSWORD)
#
# Con SQL Server 2022 (el mismo motor que Azure SQL):
#   docker compose --profile sqlserver up -d db
#   docker compose --profile sqlserver run --rm init-db
#   docker compose --profile sqlserver up -d app-sqlserver
services:
  app:
    build: .
    image: hajime:latest
    ports: ["8000:8000"]
    environment:
      HAJIME_ADMIN_PASSWORD: ${HAJIME_ADMIN_PASSWORD:-cambiar-esta-clave}
    volumes: [hajime-data:/data]
    restart: unless-stopped

  db:
    profiles: [sqlserver]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Hajime_Dev_2026!"
      MSSQL_PID: Developer
    ports: ["1433:1433"]
    volumes: [mssql-data:/var/opt/mssql]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10

  init-db:
    profiles: [sqlserver]
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db: { condition: service_healthy }
    # Solo crea la base vacía; las tablas las crean las migraciones de la app.
    entrypoint: >
      bash -c "/opt/mssql-tools18/bin/sqlcmd -C -S db -U sa -P 'Hajime_Dev_2026!' -Q \"IF DB_ID('hajime') IS NULL CREATE DATABASE hajime\""

  app-sqlserver:
    profiles: [sqlserver]
    build:
      context: .
      args: { WITH_MSSQL: "true" }
    image: hajime:mssql
    depends_on:
      db: { condition: service_healthy }
    environment:
      HAJIME_DATABASE_URL: "mssql+pyodbc://sa:Hajime_Dev_2026!@db:1433/hajime?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"
      HAJIME_AUTO_CREATE_SCHEMA: "true"
      HAJIME_ADMIN_PASSWORD: ${HAJIME_ADMIN_PASSWORD:-cambiar-esta-clave}
    volumes: [hajime-data:/data]
    ports: ["8000:8000"]

volumes:
  hajime-data:
  mssql-data:
